appId: com.aistu.tutor
productName: AiStu
asar: true
directories:
  output: ../../release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/knowledge_base
    to: knowledge_base
    filter:
      - rag/chunks.jsonl
mac:
  icon: resources/icon.icns
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
# Windows 暂不排期（见 ROADMAP），保留配置以便未来启用
# win:
#   icon: resources/icon.ico
#   target:
#     - target: nsis
#       arch:
#         - x64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# nsis:
#   artifactName: ${productName}-${version}-${arch}-setup.${ext}
afterPack: ../../scripts/after-pack.cjs
artifactBuildStarted: ../../scripts/artifact-build-started.cjs
afterAllArtifactBuild: ../../scripts/after-all-artifact-build.cjs
