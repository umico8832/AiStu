appId: com.kaleidoscope.tutor
productName: Kaleidoscope
asar: true
directories:
  output: ../../release
  buildResources: resources
files:
  - out/**
  - package.json
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
afterPack: ../../scripts/after-pack.cjs
